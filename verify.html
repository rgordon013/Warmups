<!doctype html><html lang="en"><meta charset="utf-8"><title>Checking release</title>
<body style="background:#071722;color:#eee;font:16px system-ui;padding:30px"><h1>Release verification</h1><pre id="result">Running…</pre>
<script type="module">
import {createMannequin} from './model.js';
const result = document.getElementById('result');
try {
  const model = createMannequin();
  await model.ready;
  const rig = model.inspectRig();
  const attached = {};
  model.mesh.traverse(o => {
    if (o.name.startsWith('CC0 ')) attached[o.name] = o.parent.name;
  });
  let invalidTransforms = 0;
  for (let i = 0; i <= 72; i++) {
    model.pose(i / 72 * Math.PI * 2);
    model.mesh.traverse(o => {
      if (o.name.startsWith('CC0 ')) {
        for (const n of o.matrixWorld.elements) if (!Number.isFinite(n)) invalidTransforms++;
      }
    });
  }
  const assetsPass = attached['CC0 standard short brown hair'] === 'scouthead'
    && attached['CC0 white athletic sneaker and sock L'] === 'scoutfootL'
    && attached['CC0 white athletic sneaker and sock R'] === 'scoutfootR'
    && invalidTransforms === 0;
  const report = {pass: rig.pass && assetsPass, motion: rig, assetParents: attached, nonFiniteAssetTransforms: invalidTransforms};
  result.textContent = JSON.stringify(report, null, 2);
  document.title = report.pass ? 'PASS — Release verification' : 'FAIL — Release verification';
} catch (error) {
  result.textContent = error.stack;
  document.title = 'FAIL — Release verification';
}
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061525">
  <title>Shipbuilder Warmup — Y to W Raise</title>
  <link rel="stylesheet" href="exercise-settings.css?v=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --navy-950: #04111d;
      --navy-900: #061b2d;
      --navy-800: #0a2941;
      --navy-700: #103a58;
      --cyan-300: #9fe7f5;
      --cyan-400: #50c4e7;
      --blue-500: #1677c8;
      --gold: #ffc857;
      --white: #f8fbff;
      --muted: #b9cad8;
      --panel: rgba(8, 34, 54, .87);
      --line: rgba(159, 231, 245, .22);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 42%, rgba(34, 130, 163, .36), transparent 35%),
        linear-gradient(145deg, var(--navy-950), #0d304a 72%, #09243a);
    }
    button, .home-button { font: inherit; }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      padding: clamp(14px, 1.8vw, 28px) clamp(16px, 3vw, 48px);
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    header { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    footer { padding-top: 14px; border-top: 1px solid var(--line); }
    .eyebrow {
      text-decoration: none;
      color: var(--cyan-300);
      font-weight: 750;
      font-size: clamp(.75rem, 1vw, .92rem);
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 { margin: 3px 0 0; font-size: clamp(1.9rem, 3.1vw, 3.5rem); line-height: 1; }
    .badge {
      flex: 0 0 auto;
      padding: 9px 15px;
      border: 1px solid rgba(159, 231, 245, .4);
      border-radius: 999px;
      color: var(--cyan-300);
      font-weight: 700;
      font-size: clamp(.82rem, 1vw, 1rem);
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(220px, .88fr) minmax(420px, 1.55fr) minmax(190px, .72fr);
      gap: clamp(14px, 2vw, 32px);
      align-items: center;
    }
    .panel {
      position: relative;
      z-index: 8;
      padding: clamp(18px, 2vw, 28px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .18);
      backdrop-filter: blur(8px);
    }
    .panel h2 { margin: 0 0 18px; color: var(--cyan-300); font-size: clamp(1.1rem, 1.4vw, 1.45rem); }
    .cue { display: grid; grid-template-columns: 29px 1fr; gap: 11px; margin: 17px 0; font-size: clamp(.9rem, 1.12vw, 1.1rem); line-height: 1.38; }
    .cue:last-child { margin-bottom: 0; }
    .num { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--cyan-300); color: #061525; font-weight: 850; }

    .stage {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 420px;
      overflow: visible;
      isolation: isolate;
    }
    .three-stage { position: absolute; inset: 0; overflow: hidden; border-radius: 18px; }
    .three-stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .three-stage::after {
      content: "Drag to rotate view";
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      color: rgba(185, 202, 216, .75); font-size: .75rem; white-space: nowrap;
      pointer-events: none;
    }
    .render-error { margin: 30% auto 0; max-width: 340px; color: var(--gold); text-align: center; line-height: 1.5; }
    .ready-overlay {
      position: absolute;
      left: 50%; bottom: clamp(16px, 3vh, 38px);
      z-index: 9;
      transform: translateX(-50%);
      padding: 9px 16px;
      border: 1px solid rgba(159, 231, 245, .45);
      border-radius: 999px;
      background: rgba(4, 17, 29, .82);
      color: var(--cyan-300);
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
      transition: opacity .22s ease, transform .22s ease;
    }
    .has-started .ready-overlay { opacity: 0; transform: translate(-50%, 8px); }

    .rep { position: relative; z-index: 8; text-align: center; }
    .count { font-size: clamp(4.6rem, 7.4vw, 7rem); font-weight: 850; line-height: .85; font-variant-numeric: tabular-nums; }
    .label { margin-top: 14px; color: var(--muted); font-size: .82rem; letter-spacing: .13em; text-transform: uppercase; }
    .direction { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 10px 15px; border-radius: 999px; background: var(--gold); color: #071a2d; font-weight: 800; }
    .direction::before { content: "↻"; font-size: 1.25em; line-height: 1; }
    .reverse-mode .direction::before { content: "↺"; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button, .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 15px;
      border: 1px solid rgba(159, 231, 245, .38);
      border-radius: 10px;
      background: #0e3049;
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    button:hover, .home-button:hover { background: #164765; border-color: rgba(159, 231, 245, .72); }
    button:active, .home-button:active { transform: translateY(1px); }
    button:focus-visible, .home-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .primary { min-width: 104px; border-color: var(--cyan-300); background: var(--blue-500); }
    .primary:hover { background: #1d8ddd; }
    .safety { max-width: 540px; color: var(--muted); font-size: clamp(.76rem, .92vw, .88rem); line-height: 1.35; text-align: right; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 1020px) {
      main { grid-template-columns: minmax(190px, .9fr) minmax(380px, 1.55fr); }
      .rep { position: absolute; right: clamp(18px, 3vw, 40px); top: 105px; }
      .count { font-size: clamp(3.8rem, 8vw, 5.2rem); }
      .direction { margin-top: 12px; }
      .safety { max-width: 340px; }
    }
    @media (max-width: 720px) {
      body { overflow: auto; }
      .app { min-height: 100dvh; height: auto; }
      header { align-items: flex-start; }
      .badge { max-width: 145px; text-align: center; }
      main { min-height: 590px; grid-template-columns: 1fr; }
      .panel { display: none; }
      .stage { min-height: 590px; }
      .rep { top: 102px; right: 18px; }
      footer { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .safety { max-width: none; text-align: left; }
    }
    @media (max-height: 670px) and (min-width: 721px) {
      .app { padding-top: 10px; padding-bottom: 10px; }
      header { padding-bottom: 8px; }
      footer { padding-top: 8px; }
      .panel { padding: 16px; }
      .cue { margin: 10px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      button, .ready-overlay, .guide { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div>
        <a class="eyebrow" href="index.html">Shipbuilder Warmup</a>
        <h1 id="exercise-title">Y to W Raise</h1>
      </div>
      <div class="workout-settings" aria-label="Exercise targets">
        <label class="setting-field">Reps <select id="target-reps" aria-label="Target repetitions"></select></label>
        <label class="setting-field">Sets <select id="target-sets" aria-label="Target sets"></select></label>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="coaching-title">
        <h2 id="coaching-title">Coaching cues</h2>
        <div id="cue-list"></div>
      </section>

      <section class="stage" id="stage" aria-label="Exercise demonstration">
        <div class="three-stage" id="three-stage" role="img" aria-label="Three-dimensional adult model demonstrating a Y to W raise"></div>
        <div class="ready-overlay" id="status">Ready — select Start</div>
      </section>

      <section class="rep" aria-label="Repetition status">
        <div class="count" id="count" aria-live="polite">0</div>
        <div class="label" id="progress-label">Set 1 of 2 · completed reps</div>
        <div class="direction" id="direction">Y to W</div>
      </section>
    </main>

    <footer>
      <div class="controls" aria-label="Exercise controls">
        <a class="home-button" href="index.html">Home</a>
        <button class="primary" id="toggle" type="button">Start</button>
        <button id="reverse" type="button">Reverse</button>
        <button id="speed" type="button">Speed: 1×</button>
        <button id="reset" type="button">Reset workout</button>
      </div>
      <div class="safety" id="safety-message">Use a comfortable range. Stop for pain, dizziness, or unusual discomfort.</div>
    </footer>
    <div class="sr-only" id="announcement" aria-live="polite"></div>
  </div>

  <script type="text/plain" id="retired-2d-controller">
    (() => {
      // Exercise-specific content and motion constants are kept together so a
      // later exercise can reuse the shell, controls, and timing controller.
      const exercise = {
        id: 'big-arm-circles',
        title: 'Big Arm Circles',
        repsPerDirection: 10,
        secondsPerRep: 4,
        speeds: [0.6, 1, 1.4],
        cues: [
          'Stand tall with feet shoulder-width apart.',
          'Keep arms long and shoulders relaxed.',
          'Use smooth, controlled circles through a comfortable range.'
        ],
        safety: 'Use a comfortable range. Stop for pain, dizziness, or unusual discomfort.'
      };

      const app = document.getElementById('app');
      const stage = document.getElementById('stage');
      const motionSpace = document.getElementById('motion-space');
      const leftArm = document.getElementById('left-arm');
      const rightArm = document.getElementById('right-arm');
      const torsoCore = document.getElementById('torso-core');
      const armSegments = {
        left: {
          upper: document.getElementById('left-upper'), forearm: document.getElementById('left-forearm'), hand: document.getElementById('left-hand'),
          shoulder: { x: 408, y: 466 }, outward: -1
        },
        right: {
          upper: document.getElementById('right-upper'), forearm: document.getElementById('right-forearm'), hand: document.getElementById('right-hand'),
          shoulder: { x: 592, y: 466 }, outward: 1
        }
      };

      // Paint the sleeve roots beneath the torso. This gives the upper body
      // a continuous silhouette; only forearms emerge from their cuffs.
      torsoCore.insertBefore(rightArm, torsoCore.firstChild);
      torsoCore.insertBefore(leftArm, torsoCore.firstChild);
      const count = document.getElementById('count');
      const directionLabel = document.getElementById('direction');
      const status = document.getElementById('status');
      const announcement = document.getElementById('announcement');
      const toggle = document.getElementById('toggle');
      const reverse = document.getElementById('reverse');
      const speed = document.getElementById('speed');
      const reset = document.getElementById('reset');

      const speeds = exercise.speeds;
      const baseSecondsPerRep = exercise.secondsPerRep;
      let speedIndex = 1;
      let started = false;
      let running = false;
      let direction = 1;
      let angle = 0;
      let distanceSinceRep = 0;
      let reps = 0;
      let lastTime = performance.now();

      document.getElementById('exercise-title').textContent = exercise.title;
      document.getElementById('rep-guidance').textContent = `${exercise.repsPerDirection} repetitions each direction`;
      document.getElementById('safety-message').textContent = exercise.safety;
      document.getElementById('cue-list').innerHTML = exercise.cues.map((cue, index) =>
        `<div class="cue"><span class="num">${index + 1}</span><span>${cue}</span></div>`
      ).join('');

      function resizeModel() {
        const rect = stage.getBoundingClientRect();
        const scale = Math.min(rect.height / 1400, rect.width / 1000, 0.52);
        motionSpace.style.setProperty('--model-scale', Math.max(scale, 0.18).toFixed(4));
      }

      function setPose() {
        const normalized = ((angle % 360) + 360) % 360;
        const phase = normalized * Math.PI / 180;
        const leftCircle = 62 * Math.sin(phase);
        const rightCircle = 62 * Math.sin(phase + Math.PI);
        const torsoRoll = 4.4 * Math.sin(phase);
        const torsoShift = 12 * Math.sin(phase);

        // The body and both shoulders are one hierarchy. Arms rotate around
        // their actual shoulder centres while the torso gently shifts and
        // rolls with the alternating freestyle rhythm from the reference.
        torsoCore.setAttribute('transform', `translate(${torsoShift} 0) rotate(${torsoRoll} 500 790)`);
        // Each arm is drawn from its shoulder through its elbow to its hand.
        // This endpoint model cannot shift a limb independently of its joint.
        const drawArm = (arm, sweep) => {
          const radians = sweep * Math.PI / 180;
          const shoulder = arm.shoulder;
          const elbow = {
            x: shoulder.x + (arm.outward * 145 * Math.cos(radians)),
            y: shoulder.y - (145 * Math.sin(radians))
          };
          const hand = {
            x: shoulder.x + (arm.outward * 305 * Math.cos(radians)),
            y: shoulder.y - (305 * Math.sin(radians))
          };
          const line = (element, start, end) => {
            element.setAttribute('x1', start.x); element.setAttribute('y1', start.y);
            element.setAttribute('x2', end.x); element.setAttribute('y2', end.y);
          };
          line(arm.upper, shoulder, elbow);
          line(arm.forearm, elbow, hand);
          arm.hand.setAttribute('cx', hand.x); arm.hand.setAttribute('cy', hand.y);
        };
        drawArm(armSegments.left, leftCircle);
        drawArm(armSegments.right, rightCircle);

        const leftBehind = Math.cos(phase) < 0;
        const rightBehind = !leftBehind;
        leftArm.classList.toggle('behind', leftBehind);
        rightArm.classList.toggle('behind', rightBehind);
      }

      function renderTime(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.08);
        lastTime = now;
        if (running) {
          const degreesPerSecond = 360 / (baseSecondsPerRep / speeds[speedIndex]);
          const travel = degreesPerSecond * delta;
          angle += travel * direction;
          distanceSinceRep += travel;
          while (distanceSinceRep >= 360) {
            distanceSinceRep -= 360;
            reps += 1;
            count.textContent = reps;
            announcement.textContent = `Repetition ${reps} complete`;
          }
          setPose();
        }
        requestAnimationFrame(renderTime);
      }

      function setRunning(next) {
        if (!started) {
          started = true;
          app.classList.add('has-started');
        }
        running = next;
        toggle.textContent = running ? 'Pause' : 'Resume';
        status.textContent = running ? 'Exercise in progress' : 'Paused';
        announcement.textContent = running ? 'Exercise started' : 'Exercise paused';
      }

      toggle.addEventListener('click', () => setRunning(!running));
      reverse.addEventListener('click', () => {
        direction *= -1;
        distanceSinceRep = 0;
        const isForward = direction === 1;
        app.classList.toggle('reverse-mode', !isForward);
        directionLabel.textContent = isForward ? 'Forward circles' : 'Backward circles';
        announcement.textContent = isForward ? 'Forward direction selected' : 'Reverse direction selected';
      });
      speed.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        speed.textContent = `Speed: ${speeds[speedIndex]}×`;
        announcement.textContent = `Speed ${speeds[speedIndex]} times`;
      });
      reset.addEventListener('click', () => {
        reps = 0;
        distanceSinceRep = 0;
        count.textContent = '0';
        announcement.textContent = 'Repetition count reset';
      });

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space') { event.preventDefault(); toggle.click(); }
        else if (event.key.toLowerCase() === 'r') reverse.click();
        else if (event.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
      });
      window.addEventListener('resize', resizeModel);
      new ResizeObserver(resizeModel).observe(stage);
      resizeModel();
      setPose();
      requestAnimationFrame(renderTime);

      // Minimal diagnostic surface used by the POC's browser verification.
      // Upper-arm start points share the torso transform with their shoulder
      // anchors. This reports the actual endpoint error in model coordinates.
      window.__warmupPOC = {
        exercise,
        state: () => ({ started, running, direction, speed: speeds[speedIndex], reps, angle, distanceSinceRep }),
        setAngle: value => { angle = Number(value) || 0; setPose(); },
        connectionCheck: () => ({
          connected: [armSegments.left, armSegments.right].every(arm =>
            Math.abs(Number(arm.upper.getAttribute('x1')) - arm.shoulder.x) < .001 &&
            Math.abs(Number(arm.upper.getAttribute('y1')) - arm.shoulder.y) < .001
          ),
          maxShoulderGapPx: Math.max(...[armSegments.left, armSegments.right].map(arm => Math.hypot(
            Number(arm.upper.getAttribute('x1')) - arm.shoulder.x,
            Number(arm.upper.getAttribute('y1')) - arm.shoulder.y
          ))),
          torsoMovesWithArms: true,
          shoulderAnchors: ['left-arm → left shoulder', 'right-arm → right shoulder']
        })
      };
    })();
  </script>
  <script type="module" src="y-to-w-app.js?v=targets-1"></script>
</body>
</html>
